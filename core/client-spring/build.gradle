plugins {
    id "java-library"
}

repositories {
    mavenCentral()
}

dependencies {
    api project(":client")

    api "org.springframework:spring-web:$springFrameworkVersion"
    api "org.apache.httpcomponents.client5:httpclient5:$httpClient5Version"
    api "io.micrometer:micrometer-observation:$micrometerVersion"
    api platform("tools.jackson:jackson-bom:$jacksonVersion")
    api "tools.jackson.core:jackson-databind"
    implementation "org.apache.commons:commons-lang3:$apacheCommonsLang3"

    compileOnly "org.projectlombok:lombok:1.18.30"
    annotationProcessor "org.projectlombok:lombok:1.18.30"

    testImplementation "org.junit.jupiter:junit-jupiter:$junitVersion"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
}
